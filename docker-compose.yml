services:
  withings-sync:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      SYNC_INTERVAL: ${SYNC_INTERVAL:-1h}
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "withings-sync", "status", "--healthcheck"]
      interval: 5m
      timeout: 15s
      start_period: 1m
      retries: 3
