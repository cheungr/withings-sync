[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "withings-sync"
version = "2.0.0"
description = "Reliable Withings weight and body-composition sync to Garmin Connect."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "garminconnect==0.3.17",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
withings-sync = "withings_sync.sync:main"

[tool.setuptools.packages.find]
include = ["withings_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
